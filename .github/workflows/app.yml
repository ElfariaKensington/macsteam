name: Build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dylib
        run: make -j$(sysctl -n hw.ncpu)

      - name: Build config app
        working-directory: macsteam-app
        run: ./make_app.sh

      - name: Package app
        run: |
          ditto -c -k --keepParent "macsteam-app/macSteam Config.app" macSteam-Config.zip

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macSteam-Config-${{ github.sha }}
          path: |
            macSteam-Config.zip
            out/macsteam.dylib
          if-no-files-found: error
