# One-time publishing workflow for the existing v0.8.2.4 release.
# Remove this workflow after publication; do not run the old Release creator.
name: Re-release v0.8.2.4 from dev (one-shot)
on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/rerelease-v0.8.2.4.yml

permissions:
  contents: write

jobs:
  rerelease:
    if: github.event.head_commit.message == 'ci: re-release v0.8.2.4 from dev (one-shot)'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check release and source before rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v0.8.2.4" --jq .id)" = "430455512"
          current_head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/dev" --jq .object.sha)"
          test "$current_head" = "$GITHUB_SHA"
          echo "Rebuilding existing v0.8.2.4 from $GITHUB_SHA"

      - name: Build dylib
        run: make -j$(sysctl -n hw.ncpu)

      - name: Build config app
        working-directory: macsteam-app
        run: ./make_app.sh

      - name: Package DMG
        run: |
          hdiutil create -volname macSteam -srcfolder "macsteam-app/macSteam Config.app" -ov -format UDZO "macSteam-0.8.2.4.dmg"
          test -s "macSteam-0.8.2.4.dmg"
          test -s "out/macsteam.dylib"

      - name: Replace latest release asset and correct release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v0.8.2.4" "macSteam-0.8.2.4.dmg" --clobber
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/v0.8.2.4" -f sha="$GITHUB_SHA" -F force=true
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/430455512" \
            -f target_commitish="$GITHUB_SHA" \
            -f body="Rebuilt from dev commit $GITHUB_SHA. Includes macSteam's Steam startup crash regression rollback and the existing Hubcap Store integration."
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.8.2.4" --jq .object.sha)" = "$GITHUB_SHA"
          gh release view "v0.8.2.4" --json assets --jq '.assets[].name' | grep -qx "macSteam-0.8.2.4.dmg"

      - name: Upload provenance build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macSteam-v0.8.2.4-rerelease-${{ github.sha }}
          path: |
            macSteam-0.8.2.4.dmg
            out/macsteam.dylib
          if-no-files-found: error
